{% extends "base.html" %}

{% block title %}Editar Bitácora{% endblock %}

{% block content %}
    <div style="max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
        <h2 style="text-align: center; color: #2c3e50;">Editar Registro de Bitácora</h2>

        {% if error %}
            <p style="color: red; text-align: center; font-weight: bold;">{{ error }}</p>
        {% endif %}

        <!-- Formulário de edição -->
        <form method="POST" action="{{ url_for('editar_bitacora', id_bitacora=bitacora.id) }}">
            
            <label for="usuario" style="display: block; margin-bottom: 5px;">Usuário:</label>
            <input type="text" id="usuario" name="usuario" required 
                   value="{{ bitacora.usuario }}" 
                   style="width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">

            <label for="acao" style="display: block; margin-bottom: 5px;">Ação:</label>
            <textarea id="acao" name="acao" rows="4" required 
                      style="width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">{{ bitacora.acao }}</textarea>

            <label for="data" style="display: block; margin-bottom: 5px;">Data:</label>
            <input type="date" id="data" name="data" required 
                   value="{{ bitacora.data }}" 
                   style="width: 100%; padding: 8px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">

            <div style="display: flex; gap: 10px;">
                <button type="submit" 
                        style="flex: 1; padding: 10px; background-color: #2c3e50; color: white; border: none; border-radius: 4px; font-size: 1em; cursor: pointer;">
                    Salvar Alterações
                </button>
                <a href="{{ url_for('bitacora') }}" 
                   style="flex: 1; padding: 10px; background-color: #95a5a6; color: white; border: none; border-radius: 4px; font-size: 1em; text-align: center; text-decoration: none;">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
{% endblock %}
