{% extends "base.html" %}

{% block title %}Editar Bitácora{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 0 auto; background-color: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
    <h2 style="color: #2c3e50; text-align: center;">Editar Bitácora</h2>
    
    <form method="POST">
        <div style="margin-bottom: 15px;">
            <label style="display: block; font-weight: bold;">Usuário:</label>
            <!-- bitacora[1] es el usuario -->
            <input type="text" name="usuario" value="{{ bitacora[1] }}" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        
        <div style="margin-bottom: 15px;">
            <label style="display: block; font-weight: bold;">Ação:</label>
            <!-- bitacora[2] es la acción -->
            <input type="text" name="acao" value="{{ bitacora[2] }}" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        
        <div style="margin-bottom: 20px;">
            <label style="display: block; font-weight: bold;">Data:</label>
            <!-- bitacora[3] es la fecha -->
            <input type="text" name="data" value="{{ bitacora[3] }}" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        
        <button type="submit" style="width: 100%; padding: 10px; background-color: #27ae60; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">
            Salvar Alterações
        </button>
    </form>
</div>
{% endblock %}
