{%extends "base.html"%}

{%block title%}Editar Segurança Cibernética{%endblock%}

{%block content%}
<div style="max-width: 600px; margin-trim: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);">
    <h2 style="text-align: center; color: #2c3e2c;">Editar Segurança Cibernética</h2>

    {% if error %}
            <p style="color: red; text-align: center; font-weight: bold;">{{ error }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('editar_seguranca', id_seguranca=seguranca.id) }}">
            
            <label for="senha_forte" style="display: block; margin-bottom: 5px;">Senha Forte:</label>
            <input type="text" id="senha_forte" name="senha_forte" required 
                   value="{{ seguranca.senha_forte }}" 
                   style="width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">

            <label for="autenticacao" style="display: block; margin-bottom: 5px;">Autenticação:</label>
            <input type="text" id="autenticacao" name="autenticacao" required 
                   value="{{ seguranca.autenticacao }}" 
                   style="width: 100%; padding: 8px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">

            <div style="display: flex; gap: 10px;">
                <button type="submit" 
                        style="flex: 1; padding: 10px; background-color: #2c3e50; color: white; border: none; border-radius: 4px; font-size: 1em; cursor: pointer;">
                    Salvar Alterações
                </button>
                <a href="{{ url_for('seguranca_cibernetica') }}" 
                   style="flex: 1; padding: 10px; background-color: #95a5a6; color: white; border: none; border-radius: 4px; font-size: 1em; text-align: center; text-decoration: none;">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
{% endblock %}
</div>
