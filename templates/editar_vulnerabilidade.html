{% extends "base.html" %}

{% block title %}Editar Vulnerabilidade{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 0 auto; background-color: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
    <h2 style="color: #2c3e50; text-align: center;">Editar Vulnerabilidade</h2>
    
    <form method="POST">
        <div style="margin-bottom: 15px;">
            <label style="display: block; font-weight: bold; color: #333;">Nome:</label>
            <!-- Usamos vulnerabilidade[1] porque la función devuelve una lista, no un objeto -->
            <input type="text" name="nome" value="{{ vulnerabilidade[1] }}" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        
        <div style="margin-bottom: 15px;">
            <label style="display: block; font-weight: bold; color: #333;">Descrição:</label>
            <input type="text" name="descricao" value="{{ vulnerabilidade[2] }}" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        
        <div style="margin-bottom: 20px;">
            <label style="display: block; font-weight: bold; color: #333;">Impacto:</label>
            <input type="text" name="impacto" value="{{ vulnerabilidade[3] }}" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        
        <button type="submit" style="width: 100%; padding: 10px; background-color: #2980b9; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">
            Salvar Alterações
        </button>
    </form>
    
    <div style="text-align: center; margin-top: 15px;">
        <a href="{{ url_for('vulnerabilidade') }}" style="color: #7f8c8d; text-decoration: none;">Voltar para a lista</a>
    </div>
</div>
{% endblock %}
