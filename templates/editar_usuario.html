{% extends "base.html" %}

{% block title %}Editar Usuário{% endblock %}

{% block content %}
    <div class="card card-centro">
        <h2 style="text-align: center;">Editar Usuário</h2>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('editar_usuario', id_usuario = usuario.id) }}">
            
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" required 
                   value="{{ usuario.nome }}">

            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required 
                   value="{{ usuario.email }}">

            <label for="senha">Nova Senha (deixe em branco para manter a atual)</label>
            <input type="password" id="senha" name="senha" 
                   placeholder="••••••••">

            <div class="btn-grupo">
                <button type="submit" class="btn-primary">Salvar Alterações</button>
                <a href="{{ url_for('admin') }}" class="btn btn-outline">Cancelar</a>
            </div>
        </form>
    </div>
{% endblock %}
