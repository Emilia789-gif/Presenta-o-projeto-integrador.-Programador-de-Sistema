{% extends "base.html" %}

{% block title %}Cadastro de Usuário{%endblock%}

{%block content%}

<div style="max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
    <h2 style="text-align: center; color: #2c3e50;">Criar conta</h2>

    {%if error%}
        <p style="color: red; text-align: center; font-weight: bold;">{{error}}</p>

    {%endif%}
    <form method="POST" action="{{url_for('cadastro')}}">
        <label for="nome" style="display: block; margin-bottom: 5px;">Nome Completo:</label>
        <input type="text" id="nome" name="nome" required
        style="width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">

        <label for="email" style="display: block; margin-bottom: 5px;">E-mail:</label>
        <input type="email" id="email" name="email" required
        style="width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">

        <label for="senha" style="display: block; margin-bottom: 5px;">Senha:</label>
        <input type="password" name="senha" required
        style="width: 100%; padding: 8px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">

        <button type="submit"
        style="width: 100%; padding: 10px; background-color: #2c3e50; color: white; border: none; border-radius: 4px; font-size: 1em; cursor: pointer;">
        Cadastrar
        </button>
    </form>

    <p style="text-align: center; margin-top: 15px;">
        Já tem uma conta ? <a href="{{url_for('login')}}" style="color: #2c3e50;">Faça login aqui</a>
    </p>
</div>

{% endblock %}
